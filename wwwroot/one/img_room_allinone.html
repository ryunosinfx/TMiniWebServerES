	opacity: .55;

	transition: transform .09s ease, filter .12s ease, box-shadow .2s ease, background-color .12s ease;

	transform: scale(.955);

	opacity: 0;
	transition: opacity 0.15s;
	user-select: none;
	-webkit-user-select: none;
}
.ir-navz.l {
	left: 0;
	justify-content: flex-start;
	background: linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0));
}
.ir-navz.r {
	right: 0;
	justify-content: flex-end;
	background: linear-gradient(270deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0));
}
.ir-navz:hover,
.ir-navz:active {
	opacity: 0.8;
}
.ir-navz-a {
	font-size: 2.2em;
	color: #fff;
	text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
	padding: 0 12px;
	pointer-events: none;
}
@media (hover: none) {
	.ir-navz {
		opacity: 0.3;
	}
}

/* v2.18 §45: カレンダーピックアップパネル */
.ir-calbar {
	position: relative;
}
.ir-pick {
	position: absolute;
	z-index: 20;
	bottom: calc(100% + 4px); /* ctrlbar は画面下固定なので上方向に開く */
	left: 0;
	width: 230px;
	max-height: 340px;
	overflow: auto;
	background: var(--ir-bg2);
	border: 1px solid var(--ir-line);
	border-radius: 8px;
	padding: 8px;
	box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}
.ir-picklist {
	display: flex;
	flex-direction: column;
	gap: 4px;
	margin-top: 4px;
}
.ir-pickday {
	text-align: left;
}

.ir-cpick {
	background: var(--ir-bg2);
	color: var(--ir-fg);
	border: 1px solid var(--ir-line);
	border-radius: 6px;
	padding: 2px 8px;
	font-size: 0.85em;
	cursor: pointer;
}

/* v2.19 §46: タグ編集行とタグクラウド */
.ir-tgchips {
	display: inline-flex;
	flex-wrap: wrap;
	gap: 4px;
	margin-right: 6px;
}
.ir-tgchip {
	background: var(--ir-bg2);
	border: 1px solid var(--ir-line);
	border-radius: 10px;
	padding: 1px 8px;
	font-size: 0.85em;
}
.ir-tgin {
	background: var(--ir-bg);
	color: var(--ir-fg);
	border: 1px solid var(--ir-line);
	border-radius: 6px;
	padding: 2px 6px;
	width: 120px;
	font-size: 0.9em;
}
.ir-tgadd {
	padding: 2px 8px;
	font-size: 0.85em;
}
.ir-tgbtn {
	background: var(--ir-bg2);
	color: var(--ir-fg);
	border: 1px solid var(--ir-line);
	border-radius: 10px;
	padding: 1px 8px;
	font-size: 0.82em;
	cursor: pointer;
}
.ir-tgbtn:hover {
	background: var(--ir-hl);
}
.ir-tgrecent,
.ir-tgfilt {
	display: flex;
	flex-wrap: wrap;
	gap: 4px;
}

/* v2.20 §47: 部屋作成者クレーム表示 */
.ir-crinfo {
	margin-left: 8px;
	font-size: 0.85em;
}
.ir-crinfo.ok {
	color: #4caf7d;
}
.ir-crinfo.bad {
	color: #d7756a;
	font-weight: 700;
}

/* v2.21 §48: ログイン画面の部屋カード（最終参加日/画像枚数/削除） */
.ir-crd .ir-lj {
	margin-left: 8px;
}
.ir-crd .ir-nimg {
	margin-left: 8px;
	color: #8aa2c8;
}

/* v2.22 §49: ログイン画面モードボタン（画面等分・選択色）と記憶チェック */
.ir-frm .ir-modes {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 6px;
	width: 100%;
}
.ir-frm .ir-rd {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 4px;
	padding: 8px 4px;
	border: 1px solid #3a4a63;
	border-radius: 8px;
	background: #232c3d;
	cursor: pointer;
	text-align: center;
	user-select: none;
}
.ir-frm .ir-rd:has(input:checked) {
	background: #3f6fb8;
	border-color: #7fb0f0;
	color: #fff;
	font-weight: 700;
}
.ir-frm .ir-rd:has(input:disabled) {
	opacity: 0.45;
	cursor: default;
}
.ir-frm .ir-modesay {
	min-height: 2.2em;
	margin: 6px 0 2px;
	color: #9fb3d1;
}
.ir-frm .ir-remline {
	display: flex;
	flex-direction: row; /* v2.34 §61: ラベル column 既定を上書きしチェックと文言を同一行に */
	align-items: center;
	gap: 6px;
	margin: 6px 0;
	cursor: pointer;
	/* v2.34 §61: 記憶チェックと行ラベルを同一行・行背景をほんのり明るく */
	background: rgba(255, 255, 255, .07);
	border-radius: 6px;
	padding: 6px 8px;
}
.ir-frm .ir-remline input[type="checkbox"] {
	width: auto;
	height: auto;
	min-height: 0; /* v2.34 §61: min-height:42px（L165）で checkbox が 13x42 化しないよう解除 */
	padding: 0;
	margin: 0;
	border: 0;
	background: transparent;
	border-radius: 0;
}

/* ==== v2.24 §51: リスト表示モード / トグルスイッチ / タグバッジ ==== */
.ir-sw { position: relative; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; margin-left: 8px; }
.ir-sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ir-swtrack { flex: 0 0 auto; width: 32px; height: 17px; border-radius: 9px; background: #9a9a9a; position: relative; transition: background .15s; }
.ir-swtrack::after { content: ''; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; }
.ir-sw input:checked + .ir-swtrack { background: #1e8e47; }
.ir-sw input:checked + .ir-swtrack::after { transform: translateX(15px); }
.ir-sw input:focus-visible + .ir-swtrack { outline: 2px solid #1c86ee; outline-offset: 2px; }
.ir-calbar.ir-lhide .ir-calmode, .ir-calbar.ir-lhide .ir-cpick { display: none; }
.cal-list { flex: 1 1 100%; align-items: stretch; }
.ir-lme { color: var(--ir-mut); font-size: .85em; margin-left: 5px; }
.ir-lcols { margin-left: 8px; font-size: .78em; font-weight: normal; color: var(--ir-mut); }
.ir-lrow { display: flex; flex-direction: row; align-items: center; gap: 8px; height: 96px; box-sizing: border-box; padding: 4px 6px; border-bottom: 1px solid rgba(125,125,125,.22); width: 100%; }
.ir-lrow .ir-thumb { margin: 0; cursor: pointer; }
.ir-lcell { flex: 0 0 auto; min-width: 0; overflow: hidden; }
.ir-lc-nm { flex: 1 1 140px; white-space: nowrap; text-overflow: ellipsis; }
.ir-lc-uid { flex: 0 0 96px; white-space: nowrap; text-overflow: ellipsis; }
.ir-lc-dt { flex: 0 0 92px; font-variant-numeric: tabular-nums; }
.ir-lc-tg { flex: 1 1 120px; display: flex; gap: 4px; flex-wrap: wrap; }
.ir-lc-hs { flex: 0 0 auto; max-width: 240px; font-family: ui-monospace, monospace; font-size: .78em; color: var(--ir-mut); white-space: nowrap; text-overflow: ellipsis; }
.ir-tgl { display: inline-block; background: rgba(96,130,170,.16); border: 1px solid rgba(96,130,170,.4); font-size: .8em; padding: 0 5px; border-radius: 7px; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.ir-thumb { position: relative; }
.ir-tgline { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 2px; justify-content: center; align-items: center; flex-wrap: wrap; pointer-events: none; }
.ir-tgb { background: rgba(18,38,58,.74); color: #fff; font-size: 9px; line-height: 1.35; padding: 0 4px; border-radius: 6px; max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ==== v2.25 §52: タグ絞り込み（IndexedDB 索引ベース） ==== */
.ir-tfilter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 2px; }
.ir-tfilter:empty { display: none; }
.ir-tflbl { font-size: .85em; color: var(--ir-mut); }
.ir-tfchip { border: 1px solid var(--ir-line, #8a8a8a); border-radius: 12px; padding: 1px 9px; font-size: .85em; background: transparent; cursor: pointer; color: inherit; }
.ir-tfchip.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
.ir-tfclr { border: none; background: none; color: var(--ir-mut); font-size: .8em; cursor: pointer; text-decoration: underline; }
.ir-tfcnt { font-size: .8em; color: var(--ir-mut); margin-left: auto; }

/* ==== v2.27 §54: ヘルプ・タグ同期 ==== */
.ir-helpname { font-size: 1.2em; font-weight: 700; margin-bottom: 6px; }

/* v2.30 §57: ログイン/作成 submit 拡大+明色、鍵移動は右下 */
.ir-hdc { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.ir-tabt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; min-width: 0; }
.ir-tabcr { font-size: .72em; color: #8a94a6; font-weight: 400; white-space: nowrap; }
.ir-ptm { display: none; margin-left: 5px; padding: 1px 6px; border-radius: 4px; background: #33507e; color: #cfe3ff; font-size: .82em; white-space: nowrap; }
.ir-pbadge.showt .ir-ptm { display: inline-block; }
.ir-keyrow { flex-wrap: wrap; align-items: center; gap: 8px; }
.ir-keylbl { color: #cfd8e6; font-weight: 600; flex-basis: 100%; margin-right: 0; } /* v2.35 §62: ラベルは独行、二つの鍵ボタンを必ず同一行に揃える */
.ir-keybtn { background: #2f6fb8; border-color: #245a97; color: #fff; font-weight: 600; }
.ir-keybtn:hover { background: #3f82d0; }
.ir-remline { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 6px 8px; }
.ir-pc { color: #e8b34b; font-weight: 700; }
.ir-bigbtn { font-size: 1.9em; padding: 0.55em 1.5em; background: #4a9eff; border-color: #2f7fd1; color: #fff; }
.ir-bigbtn:hover { background: #6fb4ff; border-color: #4a9eff; }
.ir-keyrow { display: flex; justify-content: flex-end; margin-top: 8px; }
.ir-keymv { font-size: 0.9em; }
